<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="28" y1="20" x2="228" y2="236" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1c2128"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="28" y1="20" x2="228" y2="236" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#1f6feb" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#238636" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Camera Body Gradient -->
    <linearGradient id="camBodyGrad" x1="70" y1="70" x2="186" y2="186" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#e6edf3"/>
      <stop offset="100%" stop-color="#8b949e"/>
    </linearGradient>

    <!-- AI Lens Gradient -->
    <radialGradient id="lensGrad" cx="128" cy="128" r="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="35%" stop-color="#1f6feb"/>
      <stop offset="75%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </radialGradient>

    <!-- Reticle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base (Ubuntu / GNOME standard icon container) -->
  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="224" height="224" rx="52" stroke="url(#borderGrad)" stroke-width="3"/>

  <!-- AI Spatial Detection Reticle / Corner Brackets -->
  <g stroke="#58a6ff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <!-- Top-Left Bracket -->
    <path d="M 52 76 L 52 56 A 4 4 0 0 1 56 52 L 76 52" />
    <!-- Top-Right Bracket -->
    <path d="M 180 52 L 200 52 A 4 4 0 0 1 204 56 L 204 76" />
    <!-- Bottom-Left Bracket -->
    <path d="M 52 180 L 52 200 A 4 4 0 0 0 56 204 L 76 204" />
    <!-- Bottom-Right Bracket -->
    <path d="M 180 204 L 200 204 A 4 4 0 0 0 204 200 L 204 180" />
  </g>

  <!-- Security Camera Mount & Arm -->
  <path d="M 72 74 C 72 68 76 64 82 64 L 110 64 C 114 64 118 68 118 72 L 118 84 L 72 84 Z" fill="#6e7681"/>
  <path d="M 88 84 L 88 98 L 102 98 L 102 84 Z" fill="#484f58"/>

  <!-- Camera Housing (Modern Bullet / Turret shape) -->
  <g filter="url(#glow)">
    <rect x="68" y="94" width="120" height="88" rx="20" fill="url(#camBodyGrad)"/>
  </g>
  <!-- Sunshield Lip -->
  <path d="M 64 96 C 64 92 68 88 74 88 L 182 88 C 188 88 192 92 192 96 L 192 100 L 64 100 Z" fill="#8b949e"/>

  <!-- Front Lens Bezel -->
  <circle cx="128" cy="138" r="38" fill="#161b22" stroke="#30363d" stroke-width="3"/>

  <!-- Optical AI Lens Core -->
  <circle cx="128" cy="138" r="28" fill="url(#lensGrad)"/>

  <!-- Concentric Analytics Iris Rings -->
  <circle cx="128" cy="138" r="20" fill="none" stroke="#00E676" stroke-width="2" stroke-dasharray="4 3" opacity="0.85"/>
  <circle cx="128" cy="138" r="10" fill="#00E676" opacity="0.9"/>
  <circle cx="125" cy="135" r="3" fill="#ffffff" opacity="0.9"/>

  <!-- Status / Profile M Indicator LED (Active Green) -->
  <circle cx="168" cy="112" r="4.5" fill="#00E676" filter="url(#glow)"/>
  <circle cx="168" cy="112" r="2" fill="#ffffff"/>

  <!-- AI Pulse Crosshair Lines -->
  <line x1="128" y1="46" x2="128" y2="52" stroke="#00E676" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="128" y1="204" x2="128" y2="210" stroke="#00E676" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="46" y1="138" x2="52" y2="138" stroke="#00E676" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="204" y1="138" x2="210" y2="138" stroke="#00E676" stroke-width="2.5" stroke-linecap="round"/>
</svg>

